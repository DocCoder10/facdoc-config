name: Sync CDN

on:
  push:
    branches: [main]
    paths:
      - 'config/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Sync each subject individually
        run: |
          DRIVE_IDS=$(jq -r '.[] | .[] | .drive_id' config/med*.json | sort -u)
          TOTAL=$(echo "$DRIVE_IDS" | wc -l)
          echo "Found $TOTAL unique subjects to sync"

          echo "$DRIVE_IDS" | while read DRIVE_ID; do
            echo ""
            echo "--- Syncing: $DRIVE_ID ---"
            curl -s \
              "https://facdoc-cdn.doctutor360.workers.dev/sync/$DRIVE_ID" \
              -H "x-sync-token: ${{ secrets.SYNC_TOKEN }}" \
              --max-time 120
            echo ""
            sleep 1
          done

          echo ""
          echo "All subjects processed."
